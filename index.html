<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPORTS SCOREBOARD</title><style>
*{box-sizing:border-box}body{margin:0;background:#131313;color:white;font-family:Arial,'Malgun Gothic',sans-serif;touch-action:manipulation}button,input{font:inherit}button{border:0;border-radius:7px;background:#333;color:white;cursor:pointer;touch-action:manipulation}button:active{filter:brightness(1.3)}[hidden]{display:none!important}#board{height:100vh;height:100dvh;padding:2.2vh 2.3vw;display:flex;flex-direction:column;gap:2vh;user-select:none}header{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;min-height:5vh}#match{color:#bbb;font-size:2.5vh;overflow-wrap:anywhere}#sport{text-align:center;font-size:4.2vh;font-weight:bold;overflow-wrap:anywhere}#clock{text-align:right;font-size:3.8vh;font-weight:bold;font-variant-numeric:tabular-nums}.teams{display:flex;gap:1.2vw;flex:1;min-height:0}.team{flex:1;min-width:0;border-radius:12px;padding:1.5vh 1.8vw;display:flex;flex-direction:column;align-items:stretch;cursor:pointer}.name{text-align:center;font-size:5.5vh;font-weight:bold;overflow-wrap:anywhere}.score{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:min(39vh,25vw);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.score.long{font-size:min(29vh,16vw)}.minus{align-self:center;background:#ffffff30;width:24%;min-height:6vh;font-size:3.5vh;margin-bottom:2vh}.set{display:flex;align-items:center;justify-content:space-between;background:#0004;border-radius:7px;font-size:3.7vh;font-weight:bold;min-height:7vh}.set button{background:transparent;width:20%;align-self:stretch;font-size:4vh}footer{display:flex;gap:1vw;min-height:6.5vh}footer button{flex:1;font-size:2.5vh;padding:1vh .4vw}#end{background:#21633b}#setEnd{background:#285487}#setup{max-width:650px;margin:5vh auto;padding:24px}h1{text-align:center;letter-spacing:2px}label{display:block;margin:18px 0 7px;color:#ddd}input:not([type=checkbox]){width:100%;padding:14px;border:1px solid #555;background:#242424;color:white;border-radius:7px;font-size:20px}input[type=checkbox]{width:24px;height:24px;vertical-align:middle}.pair{display:flex;gap:16px}.pair>div{flex:1;min-width:0}.primary{background:#1945ad;width:100%;padding:16px;font-size:22px;margin-top:22px}.overlay{position:fixed;inset:0;background:#131313f5;display:flex;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}.dialog{max-width:680px;width:100%;background:#252525;padding:30px;border-radius:15px}.actions{display:flex;gap:12px;justify-content:center;margin-top:24px}.actions button{padding:15px 22px;font-size:20px}.winner{font-size:clamp(36px,12vh,100px);font-weight:bold;overflow-wrap:anywhere}.result{font-size:7vh;margin:15px}.gold{color:#ffd166;font-size:5vh;letter-spacing:5px}.confetti{position:absolute;top:-20px;width:9px;height:16px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(700deg);opacity:.2}}#victory{overflow:hidden}#victory>div{z-index:1;max-width:95%}#message{font-size:24px;white-space:pre-line} @media(max-width:600px) and (orientation:portrait){footer{flex-wrap:wrap}footer button{flex-basis:30%}.score{font-size:25vw}.name{font-size:4vh}}
</style></head><body><section id="setup"><h1>SPORTS SCOREBOARD</h1><form id="form"><label for="sportInput">종목명</label><input id="sportInput" required placeholder="예: 배드민턴" maxlength="40"><label for="matchInput">경기명 (선택)</label><input id="matchInput" placeholder="예: 6학년 1반" maxlength="40"><div class="pair"><div><label for="leftInput">🔵 왼쪽 팀</label><input id="leftInput" value="A팀" required maxlength="40"></div><div><label for="rightInput">🔴 오른쪽 팀</label><input id="rightInput" value="B팀" required maxlength="40"></div></div><label><input type="checkbox" id="setsInput"> 세트 점수 표시</label><button class="primary">경기 시작</button></form></section><main id="board" hidden><header><div id="match"></div><div id="sport"></div><div id="clock"></div></header><div class="teams" id="teams"></div><footer><button id="new">새 경기</button><button id="swap">좌우 교체</button><button id="reset">점수 초기화</button><button id="setEnd">세트 종료</button><button id="end">경기 종료</button><button id="full">전체 화면</button></footer></main><div class="overlay" id="modal" hidden><div class="dialog"><div id="message"></div><div class="actions"><button id="cancel">취소</button><button id="ok" style="background:#1945ad">확인</button></div></div></div><div class="overlay" id="victory" hidden><div><div id="resultTitle" class="gold"></div><div id="winner" class="winner"></div><div id="result" class="result"></div><div class="actions"><button id="back">점수판 돌아가기</button><button id="next" style="background:#1945ad">새 경기</button></div></div></div><script>
'use strict';const $=id=>document.getElementById(id),key='gym-scoreboard-v1';let state=null,action=null;try{state=JSON.parse(localStorage.getItem(key));if(!state||!Array.isArray(state.teams)||state.teams.length!==2)state=null}catch(e){state=null}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function clock(){ $('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,1000);function button(label,fn,cls){let b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=e=>{e.stopPropagation();fn()};return b}function change(i,k,n){state.teams[i][k]=Math.max(0,Math.min(9999,state.teams[i][k]+n));render()}function render(){save();$('setup').hidden=!!state;$('board').hidden=!state;if(!state)return;$('sport').textContent=state.sport;$('match').textContent=state.match;$('setEnd').hidden=!state.sets;$('teams').replaceChildren();state.teams.forEach((t,i)=>{let p=document.createElement('div');p.className='team';p.style.background=t.color;p.onclick=()=>change(i,'score',1);let name=document.createElement('div');name.className='name';name.textContent=t.name;let score=document.createElement('div');score.className='score'+(t.score>=100?' long':'');score.textContent=t.score;p.append(name,score,button('−1',()=>change(i,'score',-1),'minus'));if(state.sets){let s=document.createElement('div');s.className='set';s.onclick=e=>e.stopPropagation();let text=document.createElement('span');text.textContent='SET '+t.set;s.append(button('−',()=>change(i,'set',-1)),text,button('+',()=>change(i,'set',1)));p.append(s)}$('teams').append(p)})}function ask(msg,fn){$('message').textContent=msg;action=fn;$('cancel').hidden=!fn;$('modal').hidden=false} $('cancel').onclick=()=>{$('modal').hidden=true;action=null};$('ok').onclick=()=>{let f=action;action=null;$('modal').hidden=true;if(f)f()};$('form').onsubmit=e=>{e.preventDefault();state={sport:$('sportInput').value.trim()||'경기',match:$('matchInput').value.trim(),sets:$('setsInput').checked,teams:[{name:$('leftInput').value.trim()||'A팀',color:'#1945ad',score:0,set:0},{name:$('rightInput').value.trim()||'B팀',color:'#b91c1c',score:0,set:0}]};render()};function fresh(){if(state){$('sportInput').value=state.sport;$('matchInput').value=state.match;$('leftInput').value=state.teams[0].name;$('rightInput').value=state.teams[1].name;$('setsInput').checked=state.sets}state=null;$('victory').hidden=true;render()}$('new').onclick=()=>ask('현재 경기를 지우고 새 경기를 시작할까요?',fresh);$('swap').onclick=()=>{state.teams.reverse();render()};$('reset').onclick=()=>ask('일반 점수만 0으로 초기화할까요?',()=>{state.teams.forEach(t=>t.score=0);render()});$('setEnd').onclick=()=>{let [a,b]=state.teams;if(a.score===b.score){ask('동점입니다. 점수를 확인하세요.');return}let w=a.score>b.score?a:b;ask(w.name+' 세트 승리!\n세트 점수를 올리고 일반 점수를 초기화할까요?',()=>{w.set++;state.teams.forEach(t=>t.score=0);render()})};$('end').onclick=()=>{if(state.sets&&state.teams.some(t=>t.score!==0)){ask('마지막 세트의 점수가 남아 있습니다.\n세트 종료를 먼저 눌러 주세요.');return}ask('경기를 종료하고 결과를 표시할까요?',showWinner)};function showWinner(){let [a,b]=state.teams,k=state.sets?'set':'score',tie=a[k]===b[k];$('resultTitle').textContent=tie?'DRAW':'🏆 WINNER';$('winner').textContent=tie?'무승부':(a[k]>b[k]?a.name:b.name)+' 승리!';$('result').textContent=a[k]+' : '+b[k];$('victory').hidden=false;document.querySelectorAll('.confetti').forEach(e=>e.remove());if(!tie&&!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<65;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffd166','#fff','#60a5fa','#f87171','#4ade80'][i%5];c.style.animationDelay=Math.random()*.7+'s';c.style.setProperty('--dx',(Math.random()*200-100)+'px');$('victory').append(c);setTimeout(()=>c.remove(),3800)}}} $('back').onclick=()=>{$('victory').hidden=true};$('next').onclick=()=>ask('새 경기를 시작할까요?',fresh);$('modal').style.zIndex=20;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else ask('이 브라우저는 전체 화면 기능을 지원하지 않습니다.')}catch(e){ask('브라우저에서 전체 화면 전환을 허용하지 않습니다.')}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'전체 화면 해제':'전체 화면'});render();
</script></body></html>
